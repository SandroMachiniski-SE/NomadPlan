# Observabilidade: Prometheus (coleta as métricas da API) + Grafana (painel). Complemento dos outros arquivos:
#
#   docker compose -p nomadplan --env-file .env.prod \
#     -f docker-compose.prod.yml -f docker-compose.compartilhado.yml -f docker-compose.monitoramento.yml up -d
#
# As métricas da API saem pela porta interna 9464, só alcançável dentro da rede do Docker; o Prometheus
# também não é publicado. Só o Grafana tem endereço público (DOMINIO_GRAFANA), pelo mesmo proxy HTTPS.
# Passo a passo em docs/monitoramento.md.

services:
  api:
    environment:
      METRICAS_PORT: "9464"

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: nomadplan-prometheus
    restart: unless-stopped
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/monitoramento/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoramento/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: nomadplan-grafana
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA:?defina GRAFANA_SENHA no .env.prod}
      GF_SERVER_ROOT_URL: https://${DOMINIO_GRAFANA:?defina DOMINIO_GRAFANA no .env.prod}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Painel só de leitura para quem não tem conta (útil na apresentação); "false" exige login.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONIMO:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/monitoramento/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoramento/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
