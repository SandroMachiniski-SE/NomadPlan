services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nomadplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nomadplan
      POSTGRES_PASSWORD: nomadplan_dev
      POSTGRES_DB: nomadplan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Caixa de entrada de desenvolvimento: recebe os e-mails enviados pelo backend
  # (recuperação de senha) sem entregá-los a ninguém. Abra http://localhost:8025.
  # Se outro Mailpit já ocupa essas portas, defina MAILPIT_SMTP_PORT e MAILPIT_WEB_PORT
  # (por exemplo 1026 e 8026) em um arquivo .env na raiz do projeto.
  mailpit:
    image: axllent/mailpit:latest
    container_name: nomadplan-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  postgres_data: