name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mesma conta e senha do docker-compose.yml; o banco só existe durante a execução.
  DATABASE_URL: postgresql://nomadplan:nomadplan_dev@localhost:5432/nomadplan?schema=public
  JWT_SECRET: segredo-de-ci-apenas-para-testes-automatizados
  # Os testes montam datas na hora local ("segunda às 10h") e o sistema lê horários em Brasília.
  TZ: America/Sao_Paulo

jobs:
  backend:
    name: Backend (tipos, build, testes e cobertura)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: nomadplan
          POSTGRES_PASSWORD: nomadplan_dev
          POSTGRES_DB: nomadplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nomadplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Auditoria das dependências de produção. Hoje restam 3 altas na ferramenta de linha de comando do
      # Prisma (riscos aceitos em docs/seguranca.md): o passo avisa sem derrubar o build.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      # Testes unitários e de integração (banco real), com meta de 75% de linhas (RNF). Gera o lcov que o
      # SonarCloud lê no job "analise-estatica".
      - run: npm run test:cobertura
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/lcov.info
          retention-days: 3

  frontend:
    name: Frontend (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Testes com relatório de cobertura (lcov, lido pelo SonarCloud).
      - run: npm run test:cobertura
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/lcov.info
          retention-days: 3
      - run: npm run build
      # Só as dependências de produção: os alertas que restam são de ferramentas de desenvolvimento.
      - run: npm audit --omit=dev --audit-level=moderate

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: nomadplan
          POSTGRES_PASSWORD: nomadplan_dev
          POSTGRES_DB: nomadplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nomadplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: relatorio-playwright
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # Análise estática e de segurança (SonarCloud): bugs, vulnerabilidades, pontos de segurança e duplicação,
  # com a cobertura dos dois lados. Só roda quando o segredo SONAR_TOKEN existe (não existe em pull requests
  # do Dependabot nem de forks), para o CI não quebrar por falta de configuração.
  analise-estatica:
    name: Análise estática (SonarCloud)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          pattern: cobertura-*
      # Os lcov trazem caminhos relativos a cada pasta; o Sonar precisa deles a partir da raiz do projeto.
      - name: Ajustar os caminhos da cobertura
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          sed -i 's|^SF:|SF:backend/|' cobertura-backend/lcov.info
          sed -i 's|^SF:|SF:frontend/|' cobertura-frontend/lcov.info
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Aviso
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN não configurado, então a análise do SonarCloud foi ignorada (ver docs/analise-estatica.md)."
