# Coleta a cada 15 s as métricas da API (porta interna 9464) e as do próprio Prometheus.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: nomadplan-api
    static_configs:
      - targets: ["api:9464"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
