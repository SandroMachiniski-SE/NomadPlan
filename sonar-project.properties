# SonarCloud (análise estática e de segurança). Configuração em docs/analise-estatica.md.
# Se a organização ou o projeto criados no SonarCloud tiverem outro nome, ajuste as duas primeiras linhas.
sonar.organization=sandromachiniski-se
sonar.projectKey=SandroMachiniski-SE_NomadPlan
sonar.projectName=NomadPlan

sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.itest.ts,backend/src/testes/**
sonar.exclusions=docs/rfc-imagens/**,**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/*.itest.ts,backend/src/testes/**,backend/src/scripts/**,frontend/src/**/*.d.ts
# server.ts e main.tsx só ligam a aplicação (abrem a porta, montam a tela): nenhum teste os importa.
sonar.coverage.exclusions=scripts/**,backend/src/scripts/**,backend/src/server.ts,frontend/src/main.tsx,**/*.d.ts
sonar.javascript.lcov.reportPaths=cobertura-backend/lcov.info,cobertura-frontend/lcov.info
sonar.sourceEncoding=UTF-8

# Dispensas pontuais e justificadas (a lista completa dos riscos aceitos está em docs/seguranca.md):
# as imagens rodam como root de propósito. A API grava no volume de imagens já existente na VPS (dono root) e o
# Caddy precisa abrir as portas 80/443. Trocar o usuário quebraria os uploads sem ganho nesta arquitetura.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=deploy/Dockerfile.*
# As migrations são SQL do PostgreSQL gerado pelo Prisma e já aplicado em produção (não se edita). A regra que
# pede VARCHAR2 em vez de CHAR é do Oracle e não se aplica.
sonar.issue.ignore.multicriteria.e2.ruleKey=plsql:CharVarchar
sonar.issue.ignore.multicriteria.e2.resourceKey=backend/prisma/migrations/**
